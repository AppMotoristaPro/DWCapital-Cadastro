name: Expirar Licenças Semanais

on:
  schedule:
    # Executa toda segunda-feira às 03:00 UTC (que equivale a 00:00 BRT, pois UTC-3)
    # Se você estiver em horário de verão (UTC-2), o horário será 02:00 UTC.
    # Para garantir, use 03:00 UTC (sempre após meia-noite BRT)
    - cron: '0 3 * * 1'
  workflow_dispatch:      # Permite executar manualmente pela aba Actions

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de expiração no Render
        run: |
          curl -X POST https://dwcapital-teste.onrender.com/admin/cron/expirar_licencas \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
