{% extends "admin/layout.html" %}

{% block admin_content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
    <h2 class="text-2xl font-black text-navy mb-6">Editar Cliente</h2>
    <form method="POST" action="{{ url_for('admin.editar_cliente', id=cliente.id) }}" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase">Nome</label>
            <input type="text" name="nome" value="{{ cliente.nome }}" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none font-medium">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase">Email</label>
            <input type="email" name="email" value="{{ cliente.email or '' }}" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none font-medium">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase">Celular</label>
            <input type="text" name="celular" value="{{ cliente.celular or '' }}" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none font-medium">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase">Capital Alocado</label>
            <input type="number" step="0.01" name="capital" value="{{ cliente.capital_alocado }}" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none font-medium">
        </div>
        <button type="submit" class="w-full py-4 bg-royal text-white font-black uppercase rounded-xl mt-4">Salvar Alterações</button>
        <a href="{{ url_for('admin.dashboard') }}" class="block text-center mt-4 text-sm font-bold text-gray-500">Voltar</a>
    </form>
</div>
{% endblock %}
