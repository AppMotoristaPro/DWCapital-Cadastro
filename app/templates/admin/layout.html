{% extends "base.html" %}

{% block content %}
<div class="flex h-screen bg-ice overflow-hidden">
    
    <aside class="w-72 bg-navy text-slate-300 flex flex-col shadow-2xl z-40 border-r border-navy-light/50">
        <div class="p-8 flex flex-col items-center border-b border-navy-light">
            <div class="w-20 h-20 bg-gradient-to-br from-royal to-royal-dark rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(65,105,225,0.3)] mb-4 border border-royal/30">
                <span class="text-2xl font-black text-white tracking-tighter">DW</span>
            </div>
            <h2 class="text-xl font-bold text-white tracking-wide">Painel Admin</h2>
            <span class="text-[10px] text-royal bg-royal/10 px-3 py-1 rounded-full font-black uppercase tracking-widest mt-3">{{ current_user.nome }}</span>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="{{ url_for('admin.dashboard') }}" class="block px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint == 'admin.dashboard' %}bg-royal text-white shadow-lg shadow-royal/30 font-bold{% else %}hover:bg-navy-light hover:text-white font-medium{% endif %}">
                Dashboard Inicial
            </a>
            <a href="{{ url_for('admin.clientes_list') }}" class="block px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint == 'admin.clientes_list' %}bg-royal text-white shadow-lg shadow-royal/30 font-bold{% else %}hover:bg-navy-light hover:text-white font-medium{% endif %}">
                Gestão de Clientes
            </a>
            <a href="{{ url_for('admin.pagamentos') }}" class="block px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint and request.endpoint.startswith('admin.pagamentos') %}bg-royal text-white shadow-lg shadow-royal/30 font-bold{% else %}hover:bg-navy-light hover:text-white font-medium{% endif %}">
                Gestão de Pagamentos
            </a>
        </nav>
        
        <div class="p-6 border-t border-navy-light">
            <a href="{{ url_for('auth.logout') }}" class="flex items-center justify-center w-full px-4 py-3 text-red-400 bg-red-400/10 hover:bg-red-500 hover:text-white rounded-xl transition duration-300 font-bold text-sm border border-red-400/20 hover:border-transparent">
                Sair do Sistema
            </a>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto relative">
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-royal/5 blur-3xl pointer-events-none z-0"></div>
        {% block admin_content %}{% endblock %}
    </main>
</div>
{% endblock %}
