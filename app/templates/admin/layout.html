{% extends "base.html" %}

{% block content %}
<div class="flex h-screen bg-ice relative overflow-hidden">
    <div class="absolute top-[-10%] left-[-5%] w-[40rem] h-[40rem] bg-royal/10 rounded-full mix-blend-multiply filter blur-[128px] pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-[40rem] h-[40rem] bg-royal-dark/5 rounded-full mix-blend-multiply filter blur-[128px] pointer-events-none z-0"></div>
    
    <aside class="w-72 bg-navy/95 backdrop-blur-2xl text-slate-300 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.05)] z-40 border-r border-white/5 relative">
        <div class="p-8 flex flex-col items-center border-b border-white/5">
            <div class="w-full h-20 flex items-center justify-center mb-4">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="DW Capital" class="max-w-full max-h-full object-contain drop-shadow-lg transition-transform hover:rotate-3 opacity-90">
            </div>
            <h2 class="text-xl font-bold text-white tracking-wide">Painel Admin</h2>
            <span class="text-[10px] text-royal bg-royal/10 px-3 py-1 rounded-full font-black uppercase tracking-widest mt-3 border border-royal/20">{{ current_user.nome }}</span>
        </div>
        
        <nav class="flex-1 px-5 py-8 space-y-2 overflow-y-auto">
            <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-4 px-2">Menu de Gestão</p>
            <a href="{{ url_for('admin.dashboard') }}" class="flex items-center px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint == 'admin.dashboard' %}bg-royal/20 text-royal font-bold border border-royal/30 shadow-inner{% else %}hover:bg-white/5 hover:text-white font-medium{% endif %}">
                Dashboard
            </a>
            <a href="{{ url_for('admin.clientes_list') }}" class="flex items-center px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint == 'admin.clientes_list' %}bg-royal/20 text-royal font-bold border border-royal/30 shadow-inner{% else %}hover:bg-white/5 hover:text-white font-medium{% endif %}">
                Gestão de Clientes
            </a>
            <a href="{{ url_for('admin.pagamentos') }}" class="flex items-center px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint and request.endpoint.startswith('admin.pagamentos') %}bg-royal/20 text-royal font-bold border border-royal/30 shadow-inner{% else %}hover:bg-white/5 hover:text-white font-medium{% endif %}">
                Gestão de Pagamentos
            </a>
            <a href="{{ url_for('admin.documentos') }}" class="flex items-center px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint and request.endpoint.startswith('admin.documentos') %}bg-royal/20 text-royal font-bold border border-royal/30 shadow-inner{% else %}hover:bg-white/5 hover:text-white font-medium{% endif %}">
                Gestão de Assinaturas
            </a>
        </nav>
        
        <div class="p-5 border-t border-white/5 space-y-3">
            <a href="{{ url_for('admin.atividades') }}" class="flex items-center justify-center w-full px-4 py-3 rounded-xl transition duration-300 {% if request.endpoint == 'admin.atividades' %}bg-royal/20 text-royal font-bold border border-royal/30 shadow-inner{% else %}bg-white/5 text-blue-200 hover:bg-white/10 hover:text-white font-medium border border-white/5{% endif %} text-sm">
                Registro de Atividades
            </a>
            <a href="{{ url_for('auth.logout') }}" class="flex items-center justify-center w-full px-4 py-3 text-red-400 bg-red-400/10 hover:bg-red-500 hover:text-white rounded-xl transition duration-300 font-bold text-sm border border-red-400/20 hover:border-transparent">
                Sair do Sistema
            </a>
        </div>
    </aside>

    <main class="flex-1 p-8 lg:p-12 overflow-y-auto relative z-10 custom-scrollbar">
        {% block admin_content %}{% endblock %}
    </main>
</div>

<style>
.custom-scrollbar::-webkit-scrollbar { width: 8px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; border: 2px solid transparent; background-clip: content-box; }
</style>
{% endblock %}
