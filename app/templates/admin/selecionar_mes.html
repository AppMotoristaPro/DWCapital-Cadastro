{% extends "admin/layout.html" %}

{% block admin_content %}
<div class="max-w-md mx-auto bg-white/80 backdrop-blur-xl p-10 rounded-[2.5rem] shadow-lg border border-white">
    <h2 class="text-2xl font-black text-navy mb-6">Relatório de Gestão</h2>
    <p class="text-gray-500 mb-6 text-sm">Selecione o mês e ano para filtrar os dados.</p>
    
    <form method="GET" action="{{ url_for('admin.relatorio_gestao') }}" class="space-y-6">
        <div>
            <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1.5 ml-1">Mês</label>
            <select name="mes" required class="w-full px-5 py-4 bg-white border border-gray-200 rounded-xl outline-none font-bold text-navy focus:border-royal shadow-sm">
                {% for m in range(1, 13) %}
                <option value="{{ m }}" {% if m == mes_atual %}selected{% endif %}>{{ m }} - {{ ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m-1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1.5 ml-1">Ano</label>
            <select name="ano" required class="w-full px-5 py-4 bg-white border border-gray-200 rounded-xl outline-none font-bold text-navy focus:border-royal shadow-sm">
                {% for a in range(2024, 2028) %}
                <option value="{{ a }}" {% if a == ano_atual %}selected{% endif %}>{{ a }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="w-full py-4 bg-royal hover:bg-royal-dark text-white rounded-xl font-black uppercase tracking-widest text-xs shadow-lg transition">Gerar Relatório</button>
    </form>
</div>
{% endblock %}
