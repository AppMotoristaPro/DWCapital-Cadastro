{% extends "base.html" %}
{% block content %}
<div class="flex h-screen overflow-hidden">
    <aside class="w-64 bg-royal text-white flex flex-col shadow-xl">
        <div class="p-6 text-center border-b border-royal-dark/30">
            <h1 class="text-2xl font-black">DW Capital</h1>
            <p class="text-xs opacity-75 mt-1">{{ user.nome or 'Investidor' }}</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="{{ url_for('client.dashboard') }}" class="block p-3 rounded-lg hover:bg-royal-dark transition">Visão Geral</a>
            <a href="{{ url_for('client.faturas') }}" class="block p-3 rounded-lg hover:bg-royal-dark transition">Minhas Faturas</a>
            <a href="{{ url_for('client.perfil') }}" class="block p-3 rounded-lg hover:bg-royal-dark transition">Meu Perfil</a>
        </nav>
        <div class="p-4 border-t border-royal-dark/30">
            <a href="{{ url_for('auth.logout') }}" class="block w-full text-center p-3 bg-red-500 rounded-lg font-bold">Sair</a>
        </div>
    </aside>
    <main class="flex-1 p-8 overflow-y-auto">
        {% block client_content %}{% endblock %}
    </main>
</div>
{% endblock %}
