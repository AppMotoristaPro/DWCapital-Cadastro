{% extends "base.html" %}
{% block content %}
<div class="flex h-screen bg-ice overflow-hidden">
    <aside class="w-72 bg-gradient-to-b from-royal-dark to-navy text-slate-200 flex flex-col shadow-2xl z-20">
        <div class="p-8 flex flex-col items-center border-b border-white/10">
            <div class="w-full h-16 flex items-center justify-center mb-4">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="DW Capital" class="max-w-full max-h-full object-contain drop-shadow-md transition-transform hover:scale-105">
            </div>
            <h2 class="text-lg font-bold text-white tracking-wide">Portal do Investidor</h2>
            <span class="text-[10px] text-white/80 font-bold uppercase tracking-widest mt-1">{{ current_user.nome }}</span>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="{{ url_for('client.dashboard') }}" class="flex items-center px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint == 'client.dashboard' %}bg-white/10 text-white font-bold border-l-4 border-white{% else %}hover:bg-white/5 hover:text-white font-medium{% endif %}">
                <svg class="w-5 h-5 mr-3 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Visão Geral
            </a>
            <a href="{{ url_for('client.faturas') }}" class="flex items-center px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint == 'client.faturas' %}bg-white/10 text-white font-bold border-l-4 border-white{% else %}hover:bg-white/5 hover:text-white font-medium{% endif %}">
                <svg class="w-5 h-5 mr-3 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Extrato de Faturamento
            </a>
        </nav>
        
        <div class="p-6 border-t border-white/10">
            <a href="{{ url_for('auth.logout') }}" class="flex items-center justify-center w-full px-4 py-3 bg-white/5 hover:bg-red-500 hover:text-white rounded-xl transition duration-300 font-bold text-sm">
                Sair da Conta
            </a>
        </div>
    </aside>
    <main class="flex-1 p-8 lg:p-12 overflow-y-auto relative">
         <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-royal/5 blur-3xl pointer-events-none z-0"></div>
        <div class="relative z-10">
            {% block client_content %}{% endblock %}
        </div>
    </main>
</div>
{% endblock %}
