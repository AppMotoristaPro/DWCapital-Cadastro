{% extends "base.html" %}
{% block content %}
<div class="flex h-screen bg-ice overflow-hidden">
    <aside class="w-72 bg-gradient-to-b from-royal-dark to-navy text-slate-200 flex flex-col shadow-2xl z-20">
        <div class="p-8 flex flex-col items-center border-b border-white/10">
            <div class="w-full h-16 flex items-center justify-center mb-4">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="DW Capital" class="max-w-full max-h-full object-contain">
            </div>
            <h2 class="text-lg font-bold text-white tracking-wide">Portal do Investidor</h2>
            <span class="text-[10px] text-white/80 font-bold uppercase tracking-widest mt-1">{{ current_user.nome }}</span>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="{{ url_for('client.dashboard') }}" class="flex items-center px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint == 'client.dashboard' %}bg-white/10 text-white font-bold border-l-4 border-white{% else %}hover:bg-white/5 hover:text-white font-medium{% endif %}">Dashboard</a>
            <a href="{{ url_for('client.faturas') }}" class="flex items-center px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint == 'client.faturas' %}bg-white/10 text-white font-bold border-l-4 border-white{% else %}hover:bg-white/5 hover:text-white font-medium{% endif %}">Extrato de Faturamento</a>
            <a href="{{ url_for('client.dados_pessoais') }}" class="flex items-center px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint == 'client.dados_pessoais' %}bg-white/10 text-white font-bold border-l-4 border-white{% else %}hover:bg-white/5 hover:text-white font-medium{% endif %}">Meus Dados</a>
            <a href="{{ url_for('client.documentos') }}" class="flex items-center px-4 py-3.5 rounded-xl transition duration-300 {% if request.endpoint == 'client.documentos' %}bg-white/10 text-white font-bold border-l-4 border-white{% else %}hover:bg-white/5 hover:text-white font-medium{% endif %}">Meus Documentos</a>
        </nav>
        
        <div class="px-4 pb-6 space-y-2">
            <a href="{{ url_for('client.ajuda') }}" class="flex items-center px-4 py-3 rounded-xl bg-royal/20 text-blue-200 hover:text-white font-bold">Preciso de Ajuda</a>
            <a href="{{ url_for('auth.logout') }}" class="flex items-center justify-center w-full px-4 py-3 bg-white/5 hover:bg-red-500 hover:text-white rounded-xl transition duration-300 font-bold text-sm">Sair</a>
        </div>
    </aside>
    
    <main class="flex-1 p-8 lg:p-12 overflow-y-auto relative z-0">
        {% block client_content %}{% endblock %}
    </main>
</div>
{% endblock %}
