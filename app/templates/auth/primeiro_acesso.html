{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-navy p-4 overflow-hidden relative selection:bg-royal selection:text-white">
    <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-royal rounded-full mix-blend-multiply filter blur-[128px] opacity-40"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[30rem] h-[30rem] bg-royal-dark rounded-full mix-blend-multiply filter blur-[128px] opacity-60"></div>

    <div class="max-w-md w-full bg-navy-light/40 backdrop-blur-xl rounded-[2.5rem] shadow-2xl p-10 relative z-10 border border-white/10">
        <div class="mx-auto h-20 flex items-center justify-center mb-6">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="DW Capital Logo" class="max-w-full max-h-full object-contain drop-shadow-2xl">
        </div>

        <div id="progress-bar" class="h-1 bg-white/10 w-full rounded-full mb-8 overflow-hidden">
            <div id="progress-inner" class="h-full bg-royal transition-all duration-500 rounded-full shadow-[0_0_10px_rgba(65,105,225,0.8)]" style="width: 0%"></div>
        </div>

        <form id="multi-step-form" action="{{ url_for('auth.primeiro_acesso') }}" method="POST">
            <div class="step transition-all duration-300" id="step-1">
                <h2 class="text-3xl font-black text-white mb-2 tracking-tight">Seja bem-vindo</h2>
                <p class="text-blue-200 text-sm mb-8 font-medium">Digite seu CPF para verificarmos sua liberação no sistema.</p>
                <div class="relative">
                    <input type="text" name="cpf" id="cpf-input" required class="block rounded-2xl px-5 pb-3 pt-6 w-full text-lg font-bold text-white bg-navy/50 border border-white/10 appearance-none focus:outline-none focus:ring-2 focus:ring-royal/80 focus:border-royal peer" placeholder=" " />
                    <label for="cpf" class="absolute text-sm text-blue-300 duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-5 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 font-bold uppercase tracking-widest pointer-events-none">CPF (Apenas Números)</label>
                </div>
                <p id="cpf-error" class="hidden text-xs font-bold text-red-200 mt-3 p-3 bg-red-500/20 rounded-xl border border-red-500/30 backdrop-blur-sm"></p>
                <button type="button" id="btn-step-1" onclick="validarCpfStep1()" class="w-full mt-8 py-4 bg-gradient-to-r from-royal to-royal-dark text-white rounded-2xl font-black uppercase tracking-widest text-sm shadow-[0_0_20px_rgba(65,105,225,0.4)] transition-all transform hover:-translate-y-1">Verificar Acesso</button>
                <a href="{{ url_for('auth.login') }}" class="block text-center mt-6 text-sm font-bold text-blue-300 hover:text-white transition">Já tenho conta</a>
            </div>
            </form>
    </div>
</div>
{% endblock %}
