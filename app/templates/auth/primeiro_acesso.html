{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center relative overflow-hidden bg-navy">
    <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-royal rounded-full mix-blend-multiply filter blur-[128px] opacity-40"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[30rem] h-[30rem] bg-royal-dark rounded-full mix-blend-multiply filter blur-[128px] opacity-60"></div>

    <div class="max-w-md w-full relative z-10 space-y-8 bg-white/10 backdrop-blur-xl p-10 rounded-3xl shadow-2xl border border-white/10">
        <div class="text-center">
            <h2 class="text-3xl font-black text-white tracking-tight">Criação de Senha</h2>
            <p class="mt-2 text-sm text-blue-200 font-medium">Configure seu acesso à plataforma</p>
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="p-4 rounded-xl text-sm font-bold bg-blue-500/20 text-blue-100 border border-blue-500/50 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form class="mt-8 space-y-6" action="{{ url_for('auth.primeiro_acesso') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-blue-200 uppercase tracking-wider mb-1 block">Seu CPF (Somente números)</label>
                    <input name="cpf" type="text" required class="w-full px-5 py-4 bg-navy/50 border border-white/10 rounded-xl focus:ring-2 focus:ring-royal focus:border-transparent text-white outline-none transition">
                </div>
                <div>
                    <label class="text-xs font-bold text-blue-200 uppercase tracking-wider mb-1 block">Crie uma Senha</label>
                    <input name="senha" type="password" required class="w-full px-5 py-4 bg-navy/50 border border-white/10 rounded-xl focus:ring-2 focus:ring-royal focus:border-transparent text-white outline-none transition">
                </div>
            </div>

            <div>
                <button type="submit" class="w-full py-4 px-4 text-sm font-black tracking-widest uppercase rounded-xl text-white bg-green-500 hover:bg-green-600 shadow-[0_0_20px_rgba(34,197,94,0.3)] transition-all transform hover:-translate-y-1 border border-green-400">
                    Concluir Cadastro
                </button>
            </div>
            <div class="text-center mt-6">
                <a href="{{ url_for('auth.login') }}" class="text-sm font-bold text-blue-300 hover:text-white transition duration-200">Voltar para o Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
