{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-3xl shadow-xl border border-gray-100">
        <div>
            <h2 class="text-center text-3xl font-black text-gray-900">DW Capital</h2>
            <p class="mt-2 text-center text-sm text-gray-500 font-bold">Criação de Senha</p>
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="p-4 rounded-xl text-sm font-bold bg-red-50 text-red-600 border border-red-100 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form class="mt-8 space-y-6" action="{{ url_for('auth.primeiro_acesso') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Seu CPF (Somente números)</label>
                    <input name="cpf" type="text" required class="mt-1 w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-royal bg-gray-50">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Crie uma Senha</label>
                    <input name="senha" type="password" required class="mt-1 w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-royal bg-gray-50">
                </div>
            </div>

            <div>
                <button type="submit" class="w-full py-3 px-4 text-sm font-bold rounded-xl text-white bg-green-600 hover:bg-green-700 transition shadow-lg">
                    Concluir Cadastro
                </button>
            </div>
            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="text-sm font-bold text-gray-500 hover:underline">Voltar para o Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
