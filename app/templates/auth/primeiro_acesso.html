{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-10">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg mx-4 border-t-8 border-royal">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Primeiro Acesso</h2>
            <p class="text-sm text-gray-500 mt-1">Conclua seu cadastro na DW Capital</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded">
                <p>{{ messages[0] }}</p>
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.primeiro_acesso') }}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">CPF (Liberado pelo Admin)</label>
                <input type="text" name="cpf" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-royal focus:border-royal" placeholder="Digite seu CPF">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                <input type="text" name="nome" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-royal focus:border-royal">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Criar Senha</label>
                <input type="password" name="senha" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-royal focus:border-royal">
            </div>

            <div class="border-t border-gray-200 my-4 pt-4">
                <h3 class="text-md font-semibold text-royal mb-4">Dados Operacionais (Daytrade)</h3>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Corretora Utilizada</label>
                    <select name="corretora" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:ring-royal focus:border-royal">
                        <option value="XP">XP Investimentos</option>
                        <option value="BTG">BTG Pactual</option>
                        <option value="Clear">Clear</option>
                        <option value="Genial">Genial Investimentos</option>
                        <option value="Orama">Órama</option>
                        <option value="Outra">Outra</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Capital Alocado (R$)</label>
                    <input type="number" step="0.01" name="capital" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-royal focus:border-royal" placeholder="Ex: 5000.00">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Perfil de Risco</label>
                    <select name="perfil" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:ring-royal focus:border-royal">
                        <option value="Conservador">Conservador (Baixo Drawdown)</option>
                        <option value="Moderado">Moderado</option>
                        <option value="Arrojado">Arrojado (Maior Exposição)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow text-sm font-bold text-white bg-royal hover:bg-royal-dark transition">
                Finalizar Cadastro
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="{{ url_for('auth.login') }}" class="text-sm text-gray-600 hover:text-royal transition">Voltar para o Login</a>
        </div>
    </div>
</div>
{% endblock %}
