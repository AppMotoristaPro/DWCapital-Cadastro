{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-3xl shadow-xl border border-gray-100">
        <div>
            <h2 class="mt-2 text-center text-3xl font-black text-gray-900">DW Capital</h2>
            <p class="mt-2 text-center text-sm text-gray-500 uppercase tracking-widest font-bold">Gestão Interna</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-4 rounded-xl text-sm font-bold bg-red-50 text-red-600 border border-red-100 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form class="mt-8 space-y-6" action="{{ url_for('auth.login') }}" method="POST">
            <div class="space-y-4 rounded-md shadow-sm">
                <div>
                    <label class="sr-only">Usuário</label>
                    <input name="username" type="text" required class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-royal focus:border-royal sm:text-sm font-medium" placeholder="Usuário">
                </div>
                <div>
                    <label class="sr-only">Senha</label>
                    <input name="senha" type="password" required class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-royal focus:border-royal sm:text-sm font-medium" placeholder="Senha">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-royal hover:bg-royal-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-royal transition shadow-lg">
                    Entrar no Sistema
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
