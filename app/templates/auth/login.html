{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center relative overflow-hidden bg-navy">
    <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-royal rounded-full mix-blend-multiply filter blur-[128px] opacity-40"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[30rem] h-[30rem] bg-royal-dark rounded-full mix-blend-multiply filter blur-[128px] opacity-60"></div>

    <div class="max-w-md w-full relative z-10 space-y-8 bg-white/10 backdrop-blur-xl p-10 rounded-3xl shadow-2xl border border-white/10">
        <div class="text-center">
            <div class="mx-auto h-24 flex items-center justify-center mb-6">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="DW Capital Logo" class="max-w-full max-h-full object-contain drop-shadow-2xl transition-transform hover:scale-105">
            </div>
            <h2 class="text-3xl font-black text-white tracking-tight">DW Capital</h2>
            <p class="mt-2 text-sm text-blue-200 font-medium tracking-wide">Portal Exclusivo</p>
        </div>
        
        {% with messages = get_flashed_messages(category_filter=['error']) %}
            {% if messages %}
                {% for message in messages %}
                    <div class="p-4 rounded-xl text-sm font-bold bg-red-500/20 text-red-100 border border-red-500/50 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form class="mt-8 space-y-6" action="{{ url_for('auth.login') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-blue-200 uppercase tracking-wider mb-1 block">CPF ou Usuário</label>
                    <input name="login" type="text" required class="w-full px-5 py-4 bg-navy/50 border border-white/10 rounded-xl focus:ring-2 focus:ring-royal focus:border-transparent text-white placeholder-gray-400 font-medium transition duration-200 outline-none">
                </div>
                <div class="relative">
                    <label class="text-xs font-bold text-blue-200 uppercase tracking-wider mb-1 block">Senha</label>
                    <input name="senha" id="login-senha" type="password" required class="w-full px-5 py-4 bg-navy/50 border border-white/10 rounded-xl focus:ring-2 focus:ring-royal focus:border-transparent text-white placeholder-gray-400 font-medium transition duration-200 outline-none">
                    <button type="button" onclick="toggleLoginPassword()" class="absolute right-4 top-10 text-blue-300 hover:text-white transition-colors outline-none">
                        <svg id="eye-icon-login" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            </div>

            <div>
                <button type="submit" class="w-full py-4 px-4 text-sm font-black tracking-widest uppercase rounded-xl text-white bg-gradient-to-r from-royal to-royal-dark hover:from-royal-dark hover:to-navy transition-all duration-300 shadow-[0_0_20px_rgba(65,105,225,0.3)] hover:shadow-[0_0_25px_rgba(65,105,225,0.5)] transform hover:-translate-y-1">
                    Acessar Sistema
                </button>
            </div>
            <div class="text-center mt-6">
                <a href="{{ url_for('auth.primeiro_acesso') }}" class="text-sm font-bold text-blue-300 hover:text-white transition duration-200">Primeiro Acesso? Cadastre sua senha</a>
            </div>
        </form>
    </div>
</div>

<script>
function toggleLoginPassword() {
    const input = document.getElementById('login-senha');
    const icon = document.getElementById('eye-icon-login');
    if (input.type === "password") {
        input.type = "text";
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
    } else {
        input.type = "password";
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
    }
}
</script>
{% endblock %}
