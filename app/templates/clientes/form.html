{% extends "layout.html" %}
{% block main_content %}
<div class="max-w-3xl mx-auto">
    <div class="flex items-center gap-4 mb-8">
        <a href="{{ url_for('clientes.index') }}" class="w-10 h-10 bg-white border border-gray-200 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-50 hover:text-royal transition shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h1 class="text-3xl font-black text-gray-900 tracking-tight">
            {% if cliente %}Editar Cliente{% else %}Novo Cliente{% endif %}
        </h1>
    </div>

    <form method="POST" class="bg-white p-8 md:p-10 rounded-3xl shadow-xl border border-gray-100 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="md:col-span-2">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Nome Completo *</label>
                <input type="text" name="nome" value="{{ cliente.nome if cliente else '' }}" required class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-royal focus:border-royal transition font-medium text-gray-800">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Email</label>
                <input type="email" name="email" value="{{ cliente.email if cliente else '' }}" class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-royal focus:border-royal transition font-medium text-gray-800">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Celular / WhatsApp</label>
                <input type="text" name="celular" value="{{ cliente.celular if cliente else '' }}" class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-royal focus:border-royal transition font-medium text-gray-800">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Capital Alocado (R$)</label>
                <input type="number" step="0.01" name="valor_alocado" value="{{ cliente.valor_alocado if cliente else '' }}" class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-royal focus:border-royal transition font-black text-green-700 text-lg">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Corretora Operacional</label>
                <select name="corretora" class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-royal focus:border-royal transition font-bold text-royal">
                    <option value="" disabled {% if not cliente %}selected{% endif %}>Selecione...</option>
                    <option value="Genial" {% if cliente and cliente.corretora == 'Genial' %}selected{% endif %}>Genial Investimentos</option>
                    <option value="BTG" {% if cliente and cliente.corretora == 'BTG' %}selected{% endif %}>BTG Pactual</option>
                    <option value="XP" {% if cliente and cliente.corretora == 'XP' %}selected{% endif %}>XP Investimentos</option>
                </select>
            </div>
        </div>

        <div class="pt-6 border-t border-gray-100 mt-8">
            <button type="submit" class="w-full bg-royal hover:bg-royal-dark text-white py-4 rounded-xl font-black text-lg shadow-lg transition transform hover:-translate-y-1">
                {% if cliente %}Salvar Alterações{% else %}Cadastrar Cliente{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
