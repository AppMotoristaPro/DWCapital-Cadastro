{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-navy p-4 relative overflow-hidden selection:bg-royal selection:text-white">
    <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-royal rounded-full mix-blend-multiply filter blur-[128px] opacity-40"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[30rem] h-[30rem] bg-royal-dark rounded-full mix-blend-multiply filter blur-[128px] opacity-60"></div>

    <div class="max-w-md w-full bg-white/5 backdrop-blur-2xl rounded-[2.5rem] shadow-2xl p-10 relative z-10 border border-white/10 text-center">
        
        <div class="w-24 h-24 bg-orange-500/10 border border-orange-500/20 rounded-[2rem] flex items-center justify-center mx-auto mb-8 text-orange-400 shadow-inner">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
        </div>
        
        <h1 class="text-3xl font-black text-white mb-4 tracking-tight">Método Inválido</h1>
        <p class="text-blue-200/80 text-sm font-medium mb-10 leading-relaxed">Erro 405. O tipo de requisição enviada pelo seu navegador não é aceita por esta rota.</p>
        
        <a href="{{ url_for('auth.login') }}" class="inline-block w-full py-4 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-black uppercase tracking-widest text-xs transition border border-white/10">Reiniciar Navegação</a>
    </div>
</div>
{% endblock %}
