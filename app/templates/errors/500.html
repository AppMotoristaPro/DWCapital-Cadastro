{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-screen bg-ice p-4">
    <div class="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-lg mx-auto border border-red-50/50">
        <div class="w-24 h-24 bg-red-100 rounded-3xl flex items-center justify-center mx-auto mb-6 text-red-500 animate-pulse">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <h1 class="text-4xl font-black text-navy mb-2 tracking-tight">Ops! Erro 500</h1>

        <a href="{{ url_for('auth.login') }}" class="inline-block px-8 py-4 bg-royal hover:bg-royal-dark text-white font-black uppercase tracking-widest text-xs rounded-xl shadow-lg transition hover:-translate-y-1">Tentar Novamente</a>
    </div>
</div>
