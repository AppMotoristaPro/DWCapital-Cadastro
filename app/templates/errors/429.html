{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-navy p-4 relative overflow-hidden selection:bg-royal selection:text-white">
    <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-royal rounded-full mix-blend-multiply filter blur-[128px] opacity-40"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[30rem] h-[30rem] bg-royal-dark rounded-full mix-blend-multiply filter blur-[128px] opacity-60"></div>

    <div class="max-w-md w-full bg-white/5 backdrop-blur-2xl rounded-[2.5rem] shadow-2xl p-10 relative z-10 border border-white/10 text-center">
        
        <div class="w-24 h-24 bg-royal/20 border border-royal/30 rounded-[2rem] flex items-center justify-center mx-auto mb-8 text-royal shadow-inner">
            <svg class="w-10 h-10 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        
        <h1 class="text-3xl font-black text-white mb-4 tracking-tight">Muitas Tentativas</h1>
        <p class="text-blue-200/80 text-sm font-medium mb-10 leading-relaxed">Erro 429. Sua conexão foi pausada temporariamente pelo firewall para proteger a plataforma contra robôs. Aguarde cerca de 1 minuto.</p>
        
        <a href="{{ url_for('auth.login') }}" class="inline-block w-full py-4 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-black uppercase tracking-widest text-xs transition border border-white/10">Tentar Novamente Agora</a>
    </div>
</div>
{% endblock %}
