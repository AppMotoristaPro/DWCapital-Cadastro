{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-navy p-4 relative overflow-hidden selection:bg-royal selection:text-white">
    <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-royal rounded-full mix-blend-multiply filter blur-[128px] opacity-40"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[30rem] h-[30rem] bg-royal-dark rounded-full mix-blend-multiply filter blur-[128px] opacity-60"></div>

    <div class="max-w-md w-full bg-white/5 backdrop-blur-2xl rounded-[2.5rem] shadow-2xl p-10 relative z-10 border border-white/10 text-center">
        
        <div class="w-24 h-24 bg-white/5 border border-white/10 rounded-[2rem] flex items-center justify-center mx-auto mb-8 text-gray-400 shadow-inner rotate-12 transition-transform hover:rotate-0 duration-500">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
        </div>
        
        <h1 class="text-3xl font-black text-white mb-4 tracking-tight">Página Não Encontrada</h1>
        <p class="text-blue-200/80 text-sm font-medium mb-10 leading-relaxed">Erro 404. A URL solicitada pode estar incorreta, ou este conteúdo institucional foi movido.</p>
        
        <a href="{{ url_for('auth.login') }}" class="inline-block w-full py-4 bg-royal hover:bg-royal-dark text-white rounded-2xl font-black uppercase tracking-widest text-xs transition shadow-[0_0_20px_rgba(65,105,225,0.3)]">Voltar ao Início</a>
    </div>
</div>
{% endblock %}
