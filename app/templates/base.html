<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DW Capital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: { 
                        royal: '#4169E1', 
                        'royal-dark': '#27408B',
                        'navy': '#0A192F',       // Azul bem escuro para menus e login
                        'navy-light': '#112240', // Tom para hover nos menus
                        'ice': '#F4F7FA'         // Fundo gelo/azulado bem claro para o dashboard
                    } 
                }
            }
        }
    </script>
</head>
<body class="bg-ice min-h-screen text-slate-800 antialiased selection:bg-royal selection:text-white">
    {% block content %}{% endblock %}
</body>
</html>
